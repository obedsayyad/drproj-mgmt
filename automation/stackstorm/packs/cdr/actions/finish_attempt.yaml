---
name: finish_attempt
pack: cdr
description: Finish or advance a provisioning attempt record.
runner_type: python-script
entry_point: finish_attempt.py
enabled: true
parameters:
  timeout: {type: integer, default: 60}
  operation_id: {type: string, required: true}
  lease_generation: {type: integer, required: true}
  attempt: {type: integer, required: true}
  status: {type: string, required: true, enum: [ready, failed, uncertain, cleaned]}
  error_code: {type: string}
  result_refs: {type: object}
