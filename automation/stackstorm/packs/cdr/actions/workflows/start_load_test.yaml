version: 1.0
description: >
  Start a bounded k6 scenario on the testing host (P6.3). Validates the run against the captured policy demo.* bounds, starts k6 through the forced-command SSH key (fixed argv, no shell text from the API), polls to the end and projects ops.test_runs (status, results location, summary p95_ms/error_rate/requests). A stop request (stop_load_test) ends it cancelled. No capacity lease or slot is touched.
input:
  - operation_id
vars:
  - error: {}
  - failed_step: ''
  - run: {}
  - result: {}
tasks:
  start:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.started
      step: start
      status: running
      execution_id: <% ctx().st2.action_execution_id %>
    next:
      - when: <% succeeded() %>
        do: validate_bounds
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  validate_bounds:
    action: cdr.load_test
    input:
      task: validate
      operation_id: <% ctx().operation_id %>
    next:
      - when: <% succeeded() %>
        publish:
          - run: <% result().result %>
        do: start_k6
      - when: <% failed() %>
        publish:
          - error: <% result() %>
          - failed_step: validate_bounds
        do: fail_handler
  start_k6:
    action: cdr.load_test
    input:
      task: start
      operation_id: <% ctx().operation_id %>
      work_ms: <% ctx().run.work_ms %>
    next:
      - when: <% succeeded() %>
        do: observe
      - when: <% failed() %>
        publish:
          - error: <% result() %>
          - failed_step: start_k6
        do: fail_handler
  observe:
    action: cdr.load_test
    input:
      task: wait
      operation_id: <% ctx().operation_id %>
      run_id: <% ctx().run.run_id %>
      duration_seconds: <% ctx().run.duration_seconds %>
    next:
      - when: <% succeeded() and result().result.state = 'succeeded' %>
        publish:
          - result: <% result().result %>
        do: verifying
      - when: <% succeeded() and result().result.state = 'cancelled' %>
        publish:
          - result: <% result().result %>
        do: cancelling
      - when: <% succeeded() and result().result.state = 'failed' %>
        publish:
          - error: <% result().result %>
          - failed_step: observe
        do: fail_handler
      - when: <% failed() %>
        publish:
          - error: <% result() %>
          - failed_step: observe
        do: fail_handler
  verifying:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.step.completed
      step: verify
      status: verifying
      message: k6 finished
    next:
      - when: <% succeeded() %>
        do: succeed
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  succeed:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.succeeded
      step: done
      status: succeeded
      outcome: <% ctx().result %>
    next:
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  cancelling:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.step.completed
      step: cancel
      status: cancelling
      message: stop requested
    next:
      - when: <% succeeded() %>
        do: cancelled
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  cancelled:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.cancelled
      step: cancelled
      status: cancelled
      outcome: <% ctx().result %>
    next:
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  fail_handler:
    action: cdr.fail_operation
    input:
      operation_id: <% ctx().operation_id %>
      error: <% ctx().error %>
      step: <% ctx().failed_step or 'start' %>
    retry:
      when: <% failed() %>
      count: 5
      delay: 10
