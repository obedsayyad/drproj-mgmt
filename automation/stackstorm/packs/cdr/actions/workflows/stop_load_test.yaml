version: 1.0
description: >
  Stop the running k6 test (P6.3): marks the active ops.test_runs row cancelling, then kills the k6 container on the testing host. The start_load_test workflow notices the exit and records the run cancelled.
input:
  - operation_id
vars:
  - error: {}
  - result: {}
tasks:
  start:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.started
      step: start
      status: running
      execution_id: <% ctx().st2.action_execution_id %>
    next:
      - when: <% succeeded() %>
        do: stop_k6
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  stop_k6:
    action: cdr.load_test
    input:
      task: stop
      operation_id: <% ctx().operation_id %>
    next:
      - when: <% succeeded() %>
        publish:
          - result: <% result().result %>
        do: verifying
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  verifying:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.step.completed
      step: verify
      status: verifying
      message: k6 container killed
    next:
      - when: <% succeeded() %>
        do: succeed
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  succeed:
    action: cdr.update_ops_state
    input:
      operation_id: <% ctx().operation_id %>
      event_type: operation.succeeded
      step: done
      status: succeeded
      outcome: <% ctx().result %>
    next:
      - when: <% failed() %>
        publish:
          - error: <% result() %>
        do: fail_handler
  fail_handler:
    action: cdr.fail_operation
    input:
      operation_id: <% ctx().operation_id %>
      error: <% ctx().error %>
      step: stop_k6
    retry:
      when: <% failed() %>
      count: 5
      delay: 10
