---
name: overflow_observe
pack: cdr
description: "Overload-only recovery (T26): after the warm standby returned to backup, observe the primary alone (direct probes, serving-fleet CPU below scale_out.cpu_percent). regressed=true tells the workflow to revert to overflow. Real adapter only."
runner_type: python-script
entry_point: overflow_observe.py
enabled: true
parameters:
  timeout: {type: integer, default: 180}
  operation_id: {type: string, required: true}
  lease_generation: {type: integer, required: true}
  observe_seconds: {type: integer, default: 60}
  poll_seconds: {type: integer, default: 5}
