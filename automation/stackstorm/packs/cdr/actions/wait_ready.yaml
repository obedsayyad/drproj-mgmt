---
name: wait_ready
pack: cdr
description: Poll readiness with policy checkpoints; emits operation.waiting per checkpoint; renews the lease while waiting.
runner_type: python-script
entry_point: wait_ready.py
enabled: true
parameters:
  operation_id: {type: string, required: true}
  lease_generation: {type: integer, required: true}
  provider: {type: string, required: true, enum: [digitalocean, linode]}
  resource_id: {type: string, required: true}
  deadline_at: {type: string, required: true}
  checkpoints_at: {type: array, items: {type: string}, required: true}
  poll_seconds: {type: integer, default: 5}
