---
name: apply_routing
pack: cdr
description: "Routing change. Simulation adapter: projection only. Real adapter: HAProxy Runtime API (target lb: normal|overflow|ramp|primary_failure; primary maint/normal; slot none/backup/active/draining), fenced, dumped and audited per command."
runner_type: python-script
entry_point: apply_routing.py
enabled: true
parameters:
  operation_id: {type: string, required: true}
  lease_generation: {type: integer, required: true}
  target: {type: string, required: true}
  mode: {type: string, required: true}
  slot_generation: {type: integer, default: 0}
  weight: {type: integer}
  step_percent: {type: integer, minimum: 0, maximum: 100}
