---
name: bind_slot
pack: cdr
description: Bind a reserved slot to the created provider resource.
runner_type: python-script
entry_point: bind_slot.py
enabled: true
parameters:
  timeout: {type: integer, default: 60}
  operation_id: {type: string, required: true}
  lease_generation: {type: integer, required: true}
  slot_key: {type: string, required: true}
  slot_generation: {type: integer, required: true}
  resource_id: {type: string, required: true}
  public_ip: {type: string}
  vcpu: {type: integer}
  memory_mb: {type: integer}
