---
name: provider_cleanup
pack: cdr
description: Delete this attempt's tagged resources and confirm absence via the provider API; returns release_slot evidence.
runner_type: python-script
entry_point: provider_cleanup.py
enabled: true
parameters:
  operation_id: {type: string, required: true}
  lease_generation: {type: integer, required: true}
  provider: {type: string, required: true, enum: [digitalocean, linode]}
  slot_key: {type: string, required: true}
  attempt: {type: integer, required: true}
  resource_id: {type: string}
  confirm_poll_seconds: {type: integer, default: 2}
