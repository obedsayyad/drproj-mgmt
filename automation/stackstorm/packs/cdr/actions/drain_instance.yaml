---
name: drain_instance
pack: cdr
description: "Drain (simulation adapter, or HAProxy state drain + show servers conn polling on the real adapter) bounded by policy scale_in.drain_timeout_seconds; a timeout is a result, never a delete."
runner_type: python-script
entry_point: drain_instance.py
enabled: true
parameters:
  operation_id: {type: string, required: true}
  lease_generation: {type: integer, required: true}
  provider: {type: string, required: true}
  resource_id: {type: string, required: true}
  slot_key: {type: string, default: ''}
  timeout_seconds: {type: integer}
  poll_seconds: {type: integer, default: 2}
