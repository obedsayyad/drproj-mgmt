[defaults]
forks = 2
inventory = inventory/generated.yml,inventory/cloud_app.py
roles_path = roles
collections_path = ~/.ansible/collections:/opt/ansible/collections:/opt/drproj/ansible-venv/collections
# First contact only: confirm the fingerprint out of band and add it to known_hosts (docs/15, "First bootstrap"). Never disabled.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
gathering = smart
timeout = 30
stdout_callback = default
# Secrets come from env refs / 0600 files on the management VM. Ansible Vault is not used.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15
