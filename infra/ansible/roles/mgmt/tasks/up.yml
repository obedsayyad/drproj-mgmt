---
- name: Define the compose command
  ansible.builtin.set_fact:
    mgmt_compose: >-
      docker compose --project-name {{ mgmt_project }} --env-file {{ mgmt_env_file }}
      -f {{ mgmt_compose_dir }}/compose.yaml -f {{ mgmt_compose_dir }}/compose.ansible.yaml
    mgmt_st2_script: "{{ mgmt_config_dir }}/st2-cli.sh"

- name: Install the st2 CLI wrapper
  ansible.builtin.template:
    src: st2-cli.sh.j2
    dest: "{{ mgmt_st2_script }}"
    owner: root
    group: root
    mode: "0700"

- name: Validate the rendered Compose project
  ansible.builtin.command: "{{ mgmt_compose }} config --quiet"
  args:
    chdir: "{{ mgmt_compose_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Log in to the registry when a pull credential is supplied
  ansible.builtin.command: "docker login {{ inputs.registry.host }} -u {{ inputs.github.owner }} --password-stdin"
  args:
    stdin: "{{ lookup('ansible.builtin.env', 'GHCR_READONLY_TOKEN') }}"
  no_log: true
  changed_when: false
  when: lookup('ansible.builtin.env', 'GHCR_READONLY_TOKEN') | length > 0 and not ansible_check_mode

# Phase A: everything except the St2-Api-Key consumers' key. st2api must be healthy before the others on a fresh MongoDB.
- name: Start the stack (compose waits for the healthchecks)
  community.docker.docker_compose_v2:
    project_src: "{{ mgmt_compose_dir }}"
    project_name: "{{ mgmt_project }}"
    files: [compose.yaml, compose.ansible.yaml]
    env_files: ["{{ mgmt_env_file }}"]
    state: present
    pull: missing
    wait: true
    wait_timeout: 300
  register: mgmt_compose_up

# A replaced single-file bind mount keeps the old inode inside a running container, so recreate the runner when the pack config changed.
- name: Recreate the actionrunner after a pack config change
  ansible.builtin.command: "{{ mgmt_compose }} up -d --force-recreate --no-deps --wait st2actionrunner"
  args:
    chdir: "{{ mgmt_compose_dir }}"
  changed_when: true
  when: mgmt_pack_cfg is changed and not ansible_check_mode

- name: Register the cdr pack (and validate its config against the schema)
  ansible.builtin.command: "{{ mgmt_compose }} --profile init run --rm --no-deps st2-register"
  args:
    chdir: "{{ mgmt_compose_dir }}"
  register: mgmt_register
  changed_when: "'Registered' in mgmt_register.stdout or 'registered' in mgmt_register.stderr"
  when: not ansible_check_mode

- name: Build the pack virtualenv (once; if it does not finish, see docs/15 §8 and stop)
  ansible.builtin.command:
    argv: ["{{ mgmt_st2_script }}", run, packs.setup_virtualenv, packs=cdr]
  register: mgmt_venv
  when: not ansible_check_mode
  changed_when: true

# Phase B: the St2-Api-Key exists only once StackStorm is up.
- name: Create the St2-Api-Key for Alertmanager and the ops API (only when none exists)
  ansible.builtin.command:
    argv: ["{{ mgmt_st2_script }}", apikey, create, -k, -m, '{"used_by":"mgmt"}']
  no_log: true
  register: mgmt_new_key
  when: mgmt_st2_api_key | length == 0 and not ansible_check_mode
  changed_when: true

- name: Record whether a new St2-Api-Key was created
  ansible.builtin.set_fact:
    mgmt_key_created: "{{ mgmt_new_key.stdout is defined }}"

- name: Store the St2-Api-Key (0600)
  ansible.builtin.copy:
    content: "{{ mgmt_new_key.stdout | trim }}"
    dest: "{{ mgmt_secrets_dir }}/st2_api_key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: mgmt_key_created | bool

- name: Hand the new key file to its readers
  ansible.builtin.include_tasks: perms.yml
  when: mgmt_key_created | bool

- name: Re-render the environment with the key
  ansible.builtin.include_tasks: render.yml
  when: mgmt_key_created | bool

- name: Recreate the services that read the key (ops from the env, Alertmanager from the replaced file)
  ansible.builtin.command: "{{ mgmt_compose }} up -d --force-recreate --no-deps --wait ops alertmanager"
  args:
    chdir: "{{ mgmt_compose_dir }}"
  changed_when: true
  when: mgmt_key_created | bool

# A bind-mounted file that was replaced (new inode) is invisible to the running container: recreate the runner after the cloud VM key was installed.
- name: Recreate the runner so it sees the cloud VM key
  ansible.builtin.command: "{{ mgmt_compose }} up -d --force-recreate --no-deps --wait st2actionrunner"
  args:
    chdir: "{{ mgmt_compose_dir }}"
  changed_when: true
  when: mgmt_cloud_key_new | bool

# The 60 s reconcile timer stays off until provider tokens exist (docs/15 §8); the 6 h keep-alive timer stays on.
# Once providers.env exists the rule's state is the operator's (enabled after a successful manual reconcile), so a rerun leaves it alone.
- name: Disable the 60 s reconcile rule (only while no provider tokens are installed)
  ansible.builtin.command:
    argv: ["{{ mgmt_st2_script }}", rule, disable, cdr.reconcile_every_60s]
  when: not ansible_check_mode and not mgmt_providers_env.stat.exists
  changed_when: true

# Grafana stores the admin password in its DB after first start; GF_SECURITY_ADMIN_PASSWORD__FILE does not update it later.
# Reset only when the file value is rejected.
- name: Check the Grafana admin login with the file value
  ansible.builtin.uri:
    url: "https://{{ inputs.ingress.grafana }}/api/org"
    url_username: admin
    url_password: "{{ mgmt_grafana_password }}"
    force_basic_auth: true
    validate_certs: "{{ not mgmt_acme_staging | bool }}"
    status_code: [200, 401]
    timeout: 10
  register: mgmt_grafana_login
  no_log: true
  changed_when: false
  retries: "{{ mgmt_ready_retries }}"
  delay: "{{ mgmt_ready_delay }}"
  until: mgmt_grafana_login.status is defined
  when: not ansible_check_mode

- name: Reset the Grafana admin password to the file value (only after a rejected login)
  ansible.builtin.shell: >-
    {{ mgmt_compose }} exec -T grafana
    grafana cli admin reset-admin-password "$(cat {{ mgmt_secrets_dir }}/grafana_admin_password)"
  args:
    chdir: "{{ mgmt_compose_dir }}"
  no_log: true
  changed_when: true
  when: not ansible_check_mode and mgmt_grafana_login.status == 401
