---
- name: Wait for the ops API through Caddy
  ansible.builtin.uri:
    url: "https://{{ inputs.ingress.operations }}/api/overview"
    validate_certs: "{{ not mgmt_acme_staging | bool }}"
    return_content: true
    status_code: 200
    timeout: 10
  register: mgmt_overview
  retries: "{{ mgmt_ready_retries }}"
  delay: "{{ mgmt_ready_delay }}"
  until: mgmt_overview.status | default(0) == 200
  when: not ansible_check_mode

- name: Check the integration states
  ansible.builtin.assert:
    that:
      - mgmt_overview.json.integrations.supabase.state == 'fresh'
      - mgmt_overview.json.integrations.stackstorm.state == 'fresh'
      - mgmt_overview.json.integrations.prometheus.state == 'fresh'
      # Without provider tokens a recorded failed/old reconcile is stale or unavailable, never fresh; with providers.env the reconcile may be fresh.
      - mgmt_overview.json.integrations.providers.state in (['unavailable', 'stale', 'fresh'] if mgmt_providers_env.stat.exists else ['unavailable', 'stale'])
      # The haproxy probe judges the `haproxy` Prometheus job (P6.1): fresh once the ops image carrying the probe is deployed, otherwise "not probed".
      - mgmt_overview.json.integrations.haproxy.state in ['fresh', 'unavailable']
    fail_msg: "unexpected integration states: {{ mgmt_overview.json.integrations | to_json }}"
    quiet: true
  when: not ansible_check_mode

- name: Report
  ansible.builtin.set_stats:
    data:
      mgmt_ready: true
      acme_staging: "{{ mgmt_acme_staging }}"
  when: not ansible_check_mode
