---
# Every secret lives on management only, mode 0600 in 0700 directories. Nothing here is printed (no_log) or written to a repo.
- name: Create the config and secrets directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: ["{{ mgmt_config_dir }}", "{{ mgmt_secrets_dir }}"]

# Versioned HAProxy membership store (docs/08): written by the routing adapter in st2actionrunner (uid st2), never world-readable.
- name: Create the HAProxy membership store
  ansible.builtin.file:
    path: "{{ mgmt_haproxy_state_dir }}"
    state: directory
    owner: "{{ mgmt_st2_uid }}"
    group: "{{ mgmt_st2_gid }}"
    mode: "0700"

# ansible.builtin.password creates the file on first use and reads it afterwards, so re-runs keep the same value.
- name: Generate or read the secrets
  ansible.builtin.set_fact:
    mgmt_operator_password: "{{ lookup('ansible.builtin.password', mgmt_host_secrets_dir ~ '/ops-operator.pw length=24 chars=ascii_letters,digits') }}"
    mgmt_grafana_password: "{{ lookup('ansible.builtin.password', mgmt_secrets_dir ~ '/grafana.pw length=32 chars=ascii_letters,digits') }}"
    mgmt_st2admin_password: "{{ lookup('ansible.builtin.password', mgmt_secrets_dir ~ '/st2admin.pw length=32 chars=ascii_letters,digits') }}"
    mgmt_mongo_password: "{{ lookup('ansible.builtin.password', mgmt_secrets_dir ~ '/mongo.pw length=32 chars=ascii_letters,digits') }}"
    mgmt_rabbit_password: "{{ lookup('ansible.builtin.password', mgmt_secrets_dir ~ '/rabbitmq.pw length=32 chars=ascii_letters,digits') }}"
    mgmt_restore_pg_password: "{{ lookup('ansible.builtin.password', mgmt_secrets_dir ~ '/restore-test-pg.pw length=32 chars=ascii_letters,digits') }}"
    # HAProxy `stats auth` password (user `prometheus`): created here, read by the lb role through the same lookup; the file is the value.
    mgmt_haproxy_stats_password: "{{ lookup('ansible.builtin.password', mgmt_secrets_dir ~ '/haproxy_stats_password length=32 chars=ascii_letters,digits') }}"
  no_log: true

- name: Tighten the generated password files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - "{{ mgmt_host_secrets_dir }}/ops-operator.pw"
    - "{{ mgmt_secrets_dir }}/grafana.pw"
    - "{{ mgmt_secrets_dir }}/st2admin.pw"
    - "{{ mgmt_secrets_dir }}/mongo.pw"
    - "{{ mgmt_secrets_dir }}/rabbitmq.pw"
    - "{{ mgmt_secrets_dir }}/restore-test-pg.pw"
    - "{{ mgmt_secrets_dir }}/haproxy_stats_password"
  when: not ansible_check_mode

- name: Check which derived secret files exist
  ansible.builtin.stat:
    path: "{{ mgmt_secrets_dir }}/{{ item }}"
  loop: [ops_basic_auth_hash, st2-htpasswd, node_exporter_scrape_password, st2_api_key]
  register: mgmt_secret_stats

- name: Index the stats
  ansible.builtin.set_fact:
    mgmt_have: "{{ dict(mgmt_secret_stats.results | map(attribute='item') | zip(mgmt_secret_stats.results | map(attribute='stat.exists'))) }}"

- name: Hash the operator password (bcrypt, from stdin so it never appears in argv)
  ansible.builtin.command: htpasswd -niBC 10 operator
  args:
    stdin: "{{ mgmt_operator_password }}"
  register: mgmt_ops_hash
  changed_when: false
  no_log: true
  when: not mgmt_have.ops_basic_auth_hash
  check_mode: false

- name: Store the operator password hash
  ansible.builtin.copy:
    content: "{{ mgmt_ops_hash.stdout | trim | regex_replace('^operator:', '') | regex_replace('^\\$2y\\$', '$2a$') }}"
    dest: "{{ mgmt_secrets_dir }}/ops_basic_auth_hash"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not mgmt_have.ops_basic_auth_hash and not ansible_check_mode

- name: Hash the st2admin password
  ansible.builtin.command: htpasswd -niBC 10 st2admin
  args:
    stdin: "{{ mgmt_st2admin_password }}"
  register: mgmt_st2_hash
  changed_when: false
  no_log: true
  when: not mgmt_have['st2-htpasswd']
  check_mode: false

- name: Store the st2admin htpasswd (replaces the StackStorm default)
  ansible.builtin.copy:
    content: "{{ mgmt_st2_hash.stdout | trim }}\n"
    dest: "{{ mgmt_secrets_dir }}/st2-htpasswd"
    mode: "0600"
  no_log: true
  when: not mgmt_have['st2-htpasswd'] and not ansible_check_mode

- name: Read the primary's node_exporter password once (generated on the primary; stored here only)
  ansible.builtin.slurp:
    src: "{{ mgmt_node_exporter_password_src }}"
  delegate_to: "{{ mgmt_primary_host }}"
  register: mgmt_ne_password
  no_log: true
  when: not mgmt_have.node_exporter_scrape_password

- name: Store the node_exporter scrape password
  ansible.builtin.copy:
    content: "{{ mgmt_ne_password.content | b64decode | trim }}"
    dest: "{{ mgmt_secrets_dir }}/node_exporter_scrape_password"
    mode: "0600"
  no_log: true
  when: not mgmt_have.node_exporter_scrape_password and not ansible_check_mode

- name: Create an empty St2-Api-Key placeholder (the key is created after StackStorm is up)
  ansible.builtin.copy:
    content: ""
    dest: "{{ mgmt_secrets_dir }}/st2_api_key"
    force: false
    mode: "0600"

- name: Create an empty cloud VM key placeholder (no cloud VM key exists yet; compose mounts the path)
  ansible.builtin.copy:
    content: ""
    dest: "{{ mgmt_secrets_dir }}/cloud_vm_key"
    force: false
    mode: "0600"

- name: Write the Grafana admin password file
  ansible.builtin.copy:
    content: "{{ mgmt_grafana_password }}"
    dest: "{{ mgmt_secrets_dir }}/grafana_admin_password"
    mode: "0600"
  no_log: true

- name: Read the Supabase URLs from the DB-1 env files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ mgmt_host_secrets_dir }}/db-ops.env"
    - "{{ mgmt_host_secrets_dir }}/db-automation.env"
    - "{{ mgmt_host_secrets_dir }}/db-app_runtime.env"
    - "{{ mgmt_host_secrets_dir }}/db-stackstorm.env"
    - "{{ mgmt_host_secrets_dir }}/db-backup.env"
  register: mgmt_db_env
  no_log: true

- name: Parse the URLs
  ansible.builtin.set_fact:
    mgmt_supabase_ops_url: "{{ (mgmt_db_env.results[0].content | b64decode) | regex_search('(?m)^SUPABASE_OPS_URL=(.+)$', '\\1') | first | trim }}"
    mgmt_dr_automation_url: "{{ (mgmt_db_env.results[1].content | b64decode) | regex_search('(?m)^DR_AUTOMATION_URL=(.+)$', '\\1') | first | trim }}"
    mgmt_pack_db_url: "{{ (mgmt_db_env.results[3].content | b64decode) | regex_search('(?m)^DR_STACKSTORM_URL=(.+)$', '\\1') | first | trim }}"
    mgmt_backup_db_url: "{{ (mgmt_db_env.results[4].content | b64decode) | regex_search('(?m)^SUPABASE_BACKUP_URL=(.+)$', '\\1') | first | trim }}"
    mgmt_supabase_app_url: "{{ (mgmt_db_env.results[2].content | b64decode) | regex_search('(?m)^SUPABASE_APP_URL=(.+)$', '\\1') | first | trim }}"
  no_log: true

- name: Write the StackStorm service credentials
  ansible.builtin.template:
    src: st2.user.conf.j2
    dest: "{{ mgmt_secrets_dir }}/st2.user.conf"
    mode: "0600"
  no_log: true

# provider_adapter is real, but there are no provider tokens: provisioning stays impossible until they exist (docs/15 §8).
- name: Write the cdr pack config
  ansible.builtin.template:
    src: cdr-pack-config.yaml.j2
    dest: "{{ mgmt_secrets_dir }}/cdr-pack-config.yaml"
    mode: "0600"
  register: mgmt_pack_cfg
  no_log: true

- name: Issue the runner client certificate for the HAProxy Runtime API (before ownership is handed out)
  ansible.builtin.include_tasks: runner_client.yml

- name: Hand the secret files to their container users
  ansible.builtin.include_tasks: perms.yml
