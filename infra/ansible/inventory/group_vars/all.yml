---
# The deployment inputs are the single source of versions, ports and registry values (docs/12). Pass inputs_file with -e; the default is
# /opt/drproj/ansible/deployment-inputs.local.json when running on management (the management host is the local connection), otherwise
# the gitignored runtime copy. env://NAME secrets are read from the controller environment at task time, never stored in the inputs.
inputs_file: >-
  {{ hostvars[groups['management'][0]].management_inputs_file
     if (groups['management'] | default([])) | length > 0
        and (hostvars[groups['management'][0]].ansible_connection | default('ssh')) == 'local'
     else playbook_dir ~ '/../../../deploy/inputs/deployment-inputs.local.json' }}
inputs: "{{ lookup('ansible.builtin.file', inputs_file) | from_json }}"
