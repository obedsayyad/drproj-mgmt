# Non-secret StackStorm overrides (merged after /etc/st2/st2.conf; secrets live in secrets/st2.user.conf).
# Authentication stays ENABLED (st2.conf default) and is restated here so a regression is visible in review.
[auth]
enable = True
api_url = http://st2api:9101

[database]
host = mongo
port = 27017
db_name = st2

# Coordination backend is Redis (docs/07), not ZooKeeper.
[coordination]
url = redis://redis:6379

[actionrunner]
# Exactly one actionrunner container runs; keep its worker pool small on the 4 GB VM.
virtualenv_opts = --always-copy
# Explicit worker counts (the st2 defaults are 40 workflow and 60 action dispatch slots, far above what one 512 MB
# runner should run). A capacity run needs one slot per in-flight action: scale_out holds a few at a time (a long
# wait_ready with its lease_keeper thread, the heavy deploy wrapper); policies/*.yaml serialize the rest.
workflows_pool_size = 4
actions_pool_size = 8
