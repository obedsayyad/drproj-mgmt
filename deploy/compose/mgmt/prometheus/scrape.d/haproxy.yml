# HAProxy on the load-balancer VM (P6.1): built-in prometheus-exporter on the 8404 TLS listener (project CA, `stats auth`), plus a
# blackbox probe of the public app certificate (probe_ssl_earliest_cert_expiry, docs/10 T17). Targets are generated by the mgmt role
# into monitoring/targets/{haproxy,app_cert}/ from the deployment inputs.
scrape_configs:
  - job_name: haproxy
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/ca-bundle.crt
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/haproxy-stats-password
    file_sd_configs:
      - files: ["/etc/prometheus/targets/haproxy/*.json"]
    relabel_configs:
      - target_label: role
        replacement: lb

  - job_name: app_cert
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/app_cert/*.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
