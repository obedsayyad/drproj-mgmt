# Real-deployment scrape jobs (mounted by compose.ansible.yaml only; the simulation stack has no node_exporter targets).
# node_exporter on app hosts: TLS (project CA; the leaf carries the host IP in its SAN) + basic auth.
scrape_configs:
  - job_name: node
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/ca-bundle.crt
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/node-exporter-password
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node/*.json"]
    # The real cloud VMs follow ops.instances (a VM a workflow just created is scraped within one refresh); same labels as the rendered file entries.
    http_sd_configs:
      - url: http://ops:9465/sd/cloud?port=9100
        refresh_interval: 30s
